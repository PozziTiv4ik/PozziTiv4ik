      <text x="158" y="28" text-anchor="middle" class="mono" fill="#4ade80" font-size="24" font-weight="900">2</text>
      <rect class="cell" x="184" y="0" width="40" height="40" rx="5"/>
      <rect class="cell-hot" x="230" y="0" width="40" height="40" rx="5"/>
      <text x="250" y="28" text-anchor="middle" class="mono" fill="#fbbf24" font-size="24" font-weight="900">3</text>

      <rect class="cell" x="0" y="46" width="40" height="40" rx="5"/>
      <rect class="cell-hot" x="46" y="46" width="40" height="40" rx="5"/>
      <text x="66" y="74" text-anchor="middle" class="mono" fill="#22d3ee" font-size="24" font-weight="900">1</text>
      <rect class="cell-hot" x="92" y="46" width="40" height="40" rx="5"/>
      <text x="112" y="74" text-anchor="middle" class="mono" fill="#4ade80" font-size="24" font-weight="900">2</text>
      <rect class="cell" x="138" y="46" width="40" height="40" rx="5"/>
      <rect class="cell" x="184" y="46" width="40" height="40" rx="5"/>
      <path d="M202 75V56m0 2h16l-5 6 5 6h-16" fill="#a78bfa" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"/>
      <rect class="cell" x="230" y="46" width="40" height="40" rx="5"/>

      <rect class="cell-hot" x="0" y="92" width="40" height="40" rx="5"/>
      <rect class="cell-hot" x="46" y="92" width="40" height="40" rx="5"/>
      <rect class="cell-hot" x="92" y="92" width="40" height="40" rx="5"/>
      <text x="112" y="120" text-anchor="middle" class="mono" fill="#22d3ee" font-size="24" font-weight="900">1</text>
      <rect class="cell-hot" x="138" y="92" width="40" height="40" rx="5"/>
      <text x="158" y="120" text-anchor="middle" class="mono" fill="#4ade80" font-size="24" font-weight="900">2</text>
      <rect class="cell-hot" x="184" y="92" width="40" height="40" rx="5"/>
      <text x="204" y="120" text-anchor="middle" class="mono" fill="#22d3ee" font-size="24" font-weight="900">1</text>
      <rect class="cell-hot" x="230" y="92" width="40" height="40" rx="5"/>

      <rect class="cell" x="0" y="138" width="40" height="40" rx="5"/>
      <path d="M18 167V148m0 2h16l-5 6 5 6H18" fill="#22d3ee" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/>
      <rect class="cell" x="46" y="138" width="40" height="40" rx="5"/>
      <rect class="cell-hot" x="92" y="138" width="40" height="40" rx="5"/>
      <rect class="cell-hot" x="138" y="138" width="40" height="40" rx="5"/>
      <rect class="cell" x="184" y="138" width="40" height="40" rx="5"/>
      <rect class="cell-hot" x="230" y="138" width="40" height="40" rx="5"/>
      <text x="250" y="166" text-anchor="middle" class="mono" fill="#22d3ee" font-size="24" font-weight="900">1</text>
    </g>
  </g>
