<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">PozziTiv4ik — vibe coder shipping tested open source</title>
  <desc id="desc">A neon terminal-inspired profile header with a Minesweeper board.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="0.55" stop-color="#101426"/>
      <stop offset="1" stop-color="#071b1d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a78bfa"/>
      <stop offset="0.52" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b5cf6" stroke-opacity=".075"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cell{fill:#1b263c;stroke:#34445f;stroke-width:1.4}
      .cell-hot{fill:#152f34;stroke:#22d3ee;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="#334155"/>
  <rect width="1200" height="330" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="36" r="150" fill="#22d3ee" opacity=".055" filter="url(#glow)"/>
  <circle cx="80" cy="310" r="155" fill="#8b5cf6" opacity=".075" filter="url(#glow)"/>

  <g class="mono">
    <text x="58" y="57" fill="#4ade80" font-size="17" font-weight="700">PLAYER 01 / ONLINE</text>
    <circle cx="39" cy="51" r="6" fill="#4ade80"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="54" y="139" fill="url(#accent)" font-size="69" font-weight="900" letter-spacing="2">POZZITIV4IK</text>
    <text x="58" y="184" fill="#dbeafe" font-size="24" font-weight="700">VIBE CODER / OPEN-SOURCE BUILDER</text>
    <text x="58" y="223" fill="#8ea0bb" font-size="18">ideas  →  experiments  →  tested code  →  upstream</text>

    <g transform="translate(58 264)" font-size="15" font-weight="700">
      <rect width="126" height="34" rx="8" fill="#8b5cf6" opacity=".18" stroke="#a78bfa"/>
      <text x="63" y="22" text-anchor="middle" fill="#c4b5fd">RepoTrials</text>
      <rect x="139" width="92" height="34" rx="8" fill="#22d3ee" opacity=".14" stroke="#22d3ee"/>
      <text x="185" y="22" text-anchor="middle" fill="#67e8f9">Python</text>
      <rect x="244" width="78" height="34" rx="8" fill="#f97316" opacity=".13" stroke="#fb923c"/>
      <text x="283" y="22" text-anchor="middle" fill="#fdba74">Rust</text>
      <rect x="335" width="152" height="34" rx="8" fill="#4ade80" opacity=".12" stroke="#4ade80"/>
      <text x="411" y="22" text-anchor="middle" fill="#86efac">GitHub Actions</text>
    </g>
  </g>

  <g transform="translate(855 76)">
    <text x="132" y="-23" text-anchor="middle" class="mono" fill="#64748b" font-size="14">MINEFIELD / READY</text>
    <g>
      <rect class="cell-hot" x="0" y="0" width="40" height="40" rx="5"/>
      <text x="20" y="28" text-anchor="middle" class="mono" fill="#22d3ee" font-size="24" font-weight="900">1</text>
      <rect class="cell" x="46" y="0" width="40" height="40" rx="5"/>
      <rect class="cell" x="92" y="0" width="40" height="40" rx="5"/>
      <path d="M110 29V10m0 2h16l-5 6 5 6h-16" fill="#4ade80" stroke="#4ade80" stroke-width="2" stroke-linejoin="round"/>
